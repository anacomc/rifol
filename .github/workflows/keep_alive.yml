name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *' # Corre todas las noches de forma automatizada a la medianoche
  workflow_dispatch: # Activa el gran botón gris para que pruebes manualmente en caliente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Herramientas Nativas de Postgres (15 segundos)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Disparar Consulta SQL Directa al Pooler IPv4 (Resetea la Pausa)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Interrogamos al puerto 6543 usando la dirección IPv4 del pooler.
          # Usamos tu ID de proyecto unico para que Supabase sepa a que disco ir.
          psql \
          -h "${{ secrets.SUPABASE_DB_HOST }}" \
          -p 6543 \
          -U "postgres.qajwpjecppwvlfbuhhey" \
          -d "postgres" \
          -c "SELECT id FROM public.maestro_licencias_activadas LIMIT 1;"
