name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *' # Despierta a la medianoche todos los días de forma automática
  workflow_dispatch: # Activa el gran botón gris para que pruebes en caliente manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Herramientas Nativas de Postgres (15 segundos)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Disparar Consulta SQL Directa al Corazón de Postgres (Resetea la Pausa)
        # Inyectamos las credenciales blindadas directamente en las variables de entorno de Linux
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Ejecutamos el psql nativo apuntando al puerto 5432 con los secretos criptográficos
          psql \
          -h "${{ secrets.SUPABASE_DB_HOST }}" \
          -p 5432 \
          -U "postgres" \
          -d "postgres" \
          -c "SELECT id FROM public.maestro_licencias_activadas LIMIT 1;"
