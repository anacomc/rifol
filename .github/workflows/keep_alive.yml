name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *' # Corre de forma perpetua todas las noches a la medianoche
  workflow_dispatch: # Activa el botón gris para que lo forces manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Herramientas Nativas de Postgres (15 segundos)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Disparar Consulta SQL Directa al Pooler IPv4 (Resetea la Pausa)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # REMACHE COMPATIBLE: Usamos el puerto 6543 del Pooler IPv4 transaccional
          psql \
          -h "${{ secrets.SUPABASE_DB_HOST }}" \
          -p 6543 \
          -U "postgres.qajwpjecppwvlfbuhhey" \
          -d "postgres" \
          -c "SELECT id FROM public.maestro_licencias_activadas LIMIT 1;"
